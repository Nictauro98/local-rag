services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Webhook notification target — points to the API inside the compose network
      MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: http://api:8000/internal/events/minio
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support — remove this block for CPU-only machines (see README)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/11434' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Init containers (run once, then exit) ───────────────────────────────────

  ollama-pull:
    # Pulls required models into the shared ollama volume before the API starts.
    # On re-runs, `ollama pull` is a no-op when the model is already up to date.
    image: ollama/ollama:latest
    restart: "no"
    entrypoint: ["sh", "-c", "ollama pull nomic-embed-text && ollama pull llama3.2"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy

  # ── Application ─────────────────────────────────────────────────────────────

  api:
    build: .
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      RAG_MINIO_ENDPOINT: minio:9000
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_OLLAMA_URL: http://ollama:11434
      RAG_REDIS_URL: redis://redis:6379
    depends_on:
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    command: arq src.handlers.ingest_worker.WorkerSettings
    environment:
      RAG_MINIO_ENDPOINT: minio:9000
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_OLLAMA_URL: http://ollama:11434
      RAG_REDIS_URL: redis://redis:6379
    # Depends on api so the Qdrant collection is created before any job runs
    depends_on:
      api:
        condition: service_healthy

  ui:
    build: .
    restart: unless-stopped
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      RAG_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  # ── Init containers (run once, then exit) ───────────────────────────────────

  minio-setup:
    # Registers the ObjectCreated webhook on the documents bucket.
    # Runs after both MinIO and the API are healthy so the bucket already exists
    # (the API's MinIOStorage creates it on startup) and the webhook target is live.
    image: quay.io/minio/mc:latest
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/documents
        mc event add local/documents arn:minio:sqs::PRIMARY:webhook --event put || true
    depends_on:
      minio:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  minio_data:
  qdrant_data:
  ollama_data:
