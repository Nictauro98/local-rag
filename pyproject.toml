[project]
name = "local-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.35",
    "httpx>=0.27",
    "minio>=7.2",
    "qdrant-client>=1.9",
    "arq>=0.26",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "unstructured>=0.14",
    "langchain-text-splitters>=0.2",
    "langgraph>=0.1",
    "python-multipart>=0.0.9",
    "httpx2>=2.5.0",
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.4",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: marks tests as integration (deselect with '-m not integration')"]
