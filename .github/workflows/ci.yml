name: CI

on:
  push:
  pull_request:

jobs:
  # ── Lint + unit tests (no services required) ────────────────────────────────
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run black --check .

      - name: Unit tests
        run: uv run pytest tests/unit -v

  # ── Integration tests (spins up the full compose stack) ─────────────────────
  integration:
    runs-on: ubuntu-latest
    # Integration tests are slow (model pulls + CPU inference); allow lint to
    # fail fast without blocking this job unnecessarily.
    needs: lint-and-unit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Start stack (CPU mode, llama3.2:1b)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API (up to 600 s for model pull + startup)..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000/docs > /dev/null 2>&1; then
              echo "API is up after $((i * 5)) s"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "API did not become healthy in time"
              docker compose logs
              exit 1
            fi
            sleep 5
          done

      - name: Run integration tests
        run: uv run pytest -m integration -v
        env:
          RAG_API_URL: http://localhost:8000
          RAG_MINIO_ENDPOINT: localhost:9000

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
